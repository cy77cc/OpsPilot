name: Docker Build & Push
run-name: "Docker: ${{ gitea.actor }} - ${{ gitea.ref_name }}"

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: registry.example.com
  IMAGE_NAME: k8s-manage
  DOCKER_BUILDKIT: 1

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: []
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: https://github.com/docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Login to Registry
        if: gitea.event_name != 'pull_request' && secrets.REGISTRY_USER != ''
        uses: https://github.com/docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        id: build
        uses: https://github.com/docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ gitea.event_name != 'pull_request' && secrets.REGISTRY_USER != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Save Docker image artifact for PR
        if: gitea.event_name == 'pull_request'
        uses: https://github.com/docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          outputs: type=docker,dest=/tmp/image.tar
          cache-from: type=gha

      - name: Upload Docker image artifact
        if: gitea.event_name == 'pull_request'
        uses: https://github.com/actions/upload-artifact@v4
        with:
          name: docker-image-pr-${{ gitea.event.pull_request.number }}
          path: /tmp/image.tar
          retention-days: 7

  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    if: gitea.event_name != 'pull_request' && secrets.REGISTRY_USER != ''
    steps:
      - name: Run Trivy vulnerability scanner
        uses: https://github.com/aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-results.sarif
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: https://github.com/actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-trivy
          path: trivy-results.sarif
          retention-days: 30
